name: Scout
options:
  bundleIdPrefix: com.ralphgeb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"      # the workflow overrides this with the run number
    CODE_SIGN_STYLE: Automatic
    # Where the news comes from: the data folder the ScoutAI updater writes twice a day.
    SCOUT_DATA_URL: "https://raw.githubusercontent.com/ralphgeb/ScoutAI/main/data"
    # The shared list of stocks people follow (ScoutAI/stocks-worker), so each gets a daily AI summary.
    SCOUT_STOCKS_URL: "https://scout-stocks.ralph-gebara.workers.dev"

targets:
  Scout:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: ScoutWidgetExtension      # embeds the widget inside the app
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Scout
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.ralphgeb.scout.refresh
        ITSAppUsesNonExemptEncryption: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Scout uses your location only to show the weather for your area on Today. Just your rough area is used, and it isn't kept.
        ScoutDataURL: $(SCOUT_DATA_URL)
        ScoutStocksURL: $(SCOUT_STOCKS_URL)
        CFBundleURLTypes:
          - CFBundleURLName: Scout
            CFBundleURLSchemes:
              - scout
    entitlements:
      path: Sources/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ralphgeb.scout
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.scout
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # the looks' icons, chosen in Settings (tools/make_icon.py draws them)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Graphite AppIcon-Greyscale AppIcon-Ocean AppIcon-Forest AppIcon-Mono AppIcon-Dusk AppIcon-Sand"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  ScoutWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Scout
        ScoutDataURL: $(SCOUT_DATA_URL)
        ScoutStocksURL: $(SCOUT_STOCKS_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ralphgeb.scout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.scout.widget
        TARGETED_DEVICE_FAMILY: "1"

name: Scout – screenshots on the iPhone Duo

# Run by hand: builds Scout for the simulator, creates an iPhone Duo (on whichever iOS simulator
# runtime supports it), photographs the app closed and opened, and saves the pictures in
# screens/duo on this branch (and in the run's artifacts).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest released Xcode
        run: |
          best=""; bestv=0
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|rc|preview"); do
            v=$(DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')
            n=$(echo "$v" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
            if [ -n "$v" ] && [ "$n" -gt "$bestv" ]; then best=$x; bestv=$n; fi
          done
          if [ -n "$best" ]; then sudo xcode-select -s "$best/Contents/Developer"; fi
          xcodebuild -version

      - name: What the simulators offer (the Duo's details)
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          for d in json.load(sys.stdin)['devicetypes']:
              if 'duo' in d['name'].lower() or 'fold' in d['name'].lower(): print(json.dumps(d, indent=1))"
          echo "== simctl commands about folding / displays:"
          xcrun simctl help 2>&1 | grep -iE "fold|posture|hinge|display|ui" || true
          xcrun simctl help ui 2>&1 | head -40 || true
          xcrun simctl help io 2>&1 | head -40 || true

      - name: Build for the simulator
        working-directory: ScoutApp
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild build -project Scout.xcodeproj -scheme Scout -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5

      - name: Photograph every tab on each of the Duo's screens (and an ordinary iPhone)
        run: |
          set +e
          APP=$(ls -d ScoutApp/build/Build/Products/Debug-iphonesimulator/Scout.app)
          rm -rf screens/duo; mkdir -p screens/duo
          STORY=$(curl -s https://raw.githubusercontent.com/ralphgeb/ScoutAI/main/data/news.json | python3 -c "
          import json,sys
          s=json.load(sys.stdin)['stories']
          s=sorted([x for x in s if x.get('image')], key=lambda x:(-(x.get('importance') or 0), -len(x.get('sources',[]))))
          print(s[0]['id'] if s else '')")
          echo "Story: $STORY"
          # iOS runtimes, newest first (the Duo has its own, e.g. iOS-27-2-iPhone19-4)
          xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]
          r.sort(key=lambda x:([int(p) for p in x['version'].split('.')], 'iPhone' in x['identifier']), reverse=True)
          print('\n'.join(x['identifier'] for x in r))" > runtimes.txt
          for PAIR in "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo|duo" "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro|iphone"; do
            TYPE=${PAIR%%|*}; SLUG=${PAIR##*|}
            UDID=""
            while read -r RT; do
              UDID=$(xcrun simctl create "$SLUG" "$TYPE" "$RT" 2>/dev/null) && { echo "$SLUG on $RT"; break; }
            done < runtimes.txt
            [ -z "$UDID" ] && { echo "::warning::No runtime for $TYPE"; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl privacy "$UDID" grant location com.ralphgeb.scout
            xcrun simctl location "$UDID" set 51.5072,-0.1276
            xcrun simctl io "$UDID" enumerate > screens.txt
            # the phone's own screens (LCD, LCD-1…), not TV-out or CarPlay
            DISPLAYS=$(python3 -c "
          import re
          t=open('screens.txt').read()
          for sid,name in re.findall(r'Screen ID: (\d+)\s+Name: (LCD[^\n]*)', t): print(sid)")
            echo "$SLUG screens: $DISPLAYS"
            # one screen on at a time: folded = the outer screen, opened = the inner one
            shoot() {   # $1 name, then launch arguments
              NAME=$1; shift
              N=0
              for D in $DISPLAYS; do
                N=$((N+1))
                for O in $DISPLAYS; do
                  if [ "$O" = "$D" ]; then xcrun simctl io "$UDID" screenConfig --display="$O" power on
                  else xcrun simctl io "$UDID" screenConfig --display="$O" power off; fi
                done
                xcrun simctl terminate "$UDID" com.ralphgeb.scout 2>/dev/null
                xcrun simctl launch "$UDID" com.ralphgeb.scout -onboarded YES "$@"
                sleep 14
                LABEL=$( [ "$SLUG" = duo ] && { [ $N -eq 1 ] && echo closed || echo open; } || echo screen )
                xcrun simctl io "$UDID" screenshot --display="$D" "screens/duo/$SLUG-$LABEL-$NAME.png"
              done
            }
            shoot 1-today -scoutTab 0
            shoot 2-briefings -scoutTab 1
            shoot 3-stocks -scoutTab 2
            [ -n "$STORY" ] && shoot 4-story -scoutStartURL "scout://story/$STORY"
            xcrun simctl shutdown "$UDID"
          done
          ls -la screens/duo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-duo-screens
          path: screens/duo

      - name: Save the pictures on this branch
        if: always()
        run: |
          git config user.name "scout-screens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screens/duo
          git diff --cached --quiet || { git commit -m "Scout on the iPhone Duo: simulator screenshots" && git pull --rebase && git push; }

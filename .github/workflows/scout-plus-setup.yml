name: Scout Plus – set up the subscription

# Run by hand once: creates the Scout Plus monthly subscription in App Store Connect (safe to run
# again). Uses the same App Store Connect key as the TestFlight upload.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyjwt cryptography requests
      - run: python .github/scripts/setup_scout_plus.py

name: Probe price sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for u in \
            "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=1d&interval=5m" \
            "https://query2.finance.yahoo.com/v8/finance/chart/BARC.L?range=1mo&interval=1d" \
            "https://query1.finance.yahoo.com/v7/finance/spark?symbols=AAPL,MSFT,%5EGSPC&range=1d&interval=5m" \
            "https://query1.finance.yahoo.com/v8/finance/spark?symbols=AAPL,MSFT,%5EGSPC&range=1d&interval=5m" \
            "https://query2.finance.yahoo.com/v1/finance/search?q=scottish%20mortgage&quotesCount=5&newsCount=0" \
            "https://query1.finance.yahoo.com/v7/finance/quote?symbols=AAPL" ; do
            echo "=== $u"
            code=$(curl -s -A "$UA" -o out.json -w "%{http_code}" "$u"); echo "HTTP $code"
            head -c 1500 out.json; echo
          done
